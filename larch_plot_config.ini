[samples]
# Index of the .txt file in INPUT_PATH to plot (the script prints the file list with indices)
file_index = 0

# [] to plot every column, or a list of column indices, such as [13, 7, 8] <------------------------ Check
# Sample columns start at 7 (columns 0-6 are data information); the script prints the valid indices
sample_list = [13, 7, 8, 9, 10, 11, 12]

# [] if none, or column indices from sample_list to draw as dashed lines, such as [13] <------------ Check
standard_list = [13]

#----------------------------------------------------------------------------------------
[legends]
# [] for column names, a name list in the same order as sample_list, such as ['NbAl', 'NbSc', 'ScAl'],
# or None/off to hide the legend (e.g., for an inset). LaTeX like 'Cu$_2$O' works; write the degree sign as \u00b0 (e.g. '175\u00b0C')
sample_label = ['Ni', '1800s, 175\u00b0C', '1800s, 389\u00b0C', '1800s, 496\u00b0C', '1800s, 603\u00b0C', '1800s, 689\u00b0C', '1800s, 796\u00b0C']

#----------------------------------------------------------------------------------------
[format]
# Figure size in inches (width, height). Cheng-Hung uses (6, 7.5), but the default is (6.4, 4.8)
figure_size = (6, 7.5)

# A palettable palette; add _r to reverse the color sequence
palette = pltt.colorbrewer.diverging.Spectral_4_r

# Font size multiplier: 1 for default (title 20, axis labels 18, ticks/legend 14), e.g. 1.5 for an inset
font_scale = 1

# Curve line width (default 2)
linewidth = 3

# Frame and tick line width (default 2)
framelinewidth = 3

# 0 for default, or the number of colors to skip at the start of the palette
color_increment = 0

# Vertical offset added to each successive curve for stacking; 0 for no offset
offset = 0

# () for default, (8340, 8401) for Ni, (4425, 4625) for Sc <-------------------------------------- Check
energy_range = (8290, 8520)

# () for default, or (ymin, ymax), such as (0.85, 1.1)
y_range = ()

# Spacing between energy ticks in eV; 0 for default. Works only when energy_range is set
energy_interval = 0

# True to save the plot as .png next to this .ini file (y ticks are hidden in the saved image) <-- Check
if_save = False

# Plot title and .png name; '' to use this .ini filename
output_filename = ''
